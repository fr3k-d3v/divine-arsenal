[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "divine-arsenal-universal"
version = "0.1.0"
description = "Local-first astronomy and symbolic research with user-owned agent workspaces"
requires-python = ">=3.11"
dependencies = [
  "astronomy-engine>=2.1,<3",
  "astral>=3.2,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "mcp>=1.0,<2"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
divine-universal = "divine.cli:main"

[tool.setuptools.packages.find]
include = ["divine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
