name: Verify Universal Core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --extra test --python ${{ matrix.python-version }}
      - run: uv run pytest -q --junitxml=test-results.xml
      - run: uv run python -m compileall -q divine
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/check_web.mjs
      - run: uv build --out-dir dist
      - run: uv run python tests/check_wheel.py dist/*.whl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results.xml
